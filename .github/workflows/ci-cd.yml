# СТАДІЯ 2 (CI / Staging): Наскрізне E2E-тестування рівня L4
  e2e-staging-tests:
    name: Staging — Pentagon L4 E2E Tests (Cypress)
    needs: ci-build-and-test
    runs-on: ubuntu-latest
    environment:
      name: staging-environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: book-festival-dist
          path: dist/

      - name: Run L4 End-to-End Tests
        uses: cypress-io/github-action@v6
        with:
          start: npx --yes http-server dist -a 127.0.0.1 -p 8080 -s
          wait-on: 'http://127.0.0.1:8080'
          command: npm run test:l4